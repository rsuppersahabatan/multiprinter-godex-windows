; Godex.ini - konfigurasi godex_bridge (format sama dengan Godex.exe asli)
;
; Catatan: komentar inline (di belakang nilai) TIDAK didukung, persis seperti
; GetPrivateProfileString di Windows. Taruh komentar di baris sendiri.

[Printer]
; Nama printer atau share printer Windows.
; Format share lokal: \\localhost\<NamaShare>
; Kosongkan untuk memakai printer default.
;
; PENTING: nama di bawah ini diambil apa adanya dari Godex.ini yang lama, dan
; pada mesin ini nama itu TIDAK valid (OpenPrinter -> WinError 1801).
; Verifikasi dulu sebelum dipakai:
;     python godex_bridge.py --self-test
; Daftar printer + share yang benar bisa dilihat dengan EnumPrinters, mis.:
;     powershell -c "Get-Printer | ft Name,ShareName"
Name=\\localhost\GodexG500
; 0 = tolak semua job cetak (service tetap jalan)
Enabled=1
; 1 = log verbose
Debug=0

[Prn]
; Jalur data EZPL. Ini yang dihubungi aplikasi pengirim label.
; 0.0.0.0 = menerima dari seluruh jaringan. Ganti ke IP LAN tertentu
; (mis. 192.168.1.10) kalau hanya boleh diakses dari subnet itu.
Addr=0.0.0.0
Port=9100

[Cmd]
; Kanal kontrol line-based, hanya lokal.
Addr=127.0.0.1
Port=50000

[Log]
; Streaming log, hanya lokal.
Addr=127.0.0.1
Port=60000
