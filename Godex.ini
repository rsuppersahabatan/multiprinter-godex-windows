; Godex.ini - konfigurasi godex_bridge
;
; Catatan: komentar inline (di belakang nilai) TIDAK didukung, persis seperti
; GetPrivateProfileString di Windows. Taruh komentar di baris sendiri.
;
; Dua bentuk yang didukung:
;
;   A. Banyak printer (disarankan)
;      Satu section [Printer:<label>] per printer, masing-masing punya listener
;      Prn sendiri. Aplikasi pengirim memilih printer dengan mengganti port.
;
;   B. Satu printer (format Godex.exe asli)
;      [Printer] untuk nama + [Prn] untuk alamat/port, seperti di bawah ini.
;      Bentuk ini masih jalan apa adanya, jadi Godex.ini lama tidak perlu diubah.
;
;      [Printer]
;      Name=\\localhost\GodexG500
;      Enabled=1
;      Debug=0
;
;      [Prn]
;      Addr=0.0.0.0
;      Port=9100
;
; Kalau ada section [Printer:<label>], bentuk A yang dipakai dan [Printer]/[Prn]
; diabaikan (dicatat sebagai peringatan di log).

; ===========================================================================
; PRINTER 1
; ===========================================================================
[Printer:GodexG500]
; Nama printer Windows, atau share dengan format \\localhost\<NamaShare>.
; Kosongkan (Name=) untuk memakai printer default Windows.
;
; PENTING: nama di bawah ini diambil apa adanya dari Godex.ini lama dan pada
; mesin ini TIDAK valid (OpenPrinter -> WinError 1801) karena share-nya tidak
; ada. Pastikan dulu dengan:
;     python godex_bridge.py --list-printers
;     python godex_bridge.py --self-test
Name=\\localhost\GodexG500
; 0 = tolak semua job untuk printer ini (service tetap jalan)
Enabled=1
; 1 = log verbose (berlaku untuk semua printer)
Debug=0
; Jalur data EZPL untuk printer ini - ini yang dihubungi aplikasi pengirim.
; 0.0.0.0 = menerima dari seluruh jaringan. Ganti ke IP LAN tertentu
; (mis. 192.168.1.10) kalau hanya boleh diakses dari subnet itu.
Addr=0.0.0.0
Port=9100

; ===========================================================================
; PRINTER 2
; Hapus tanda ";" di awal tiap baris untuk mengaktifkan.
; ===========================================================================
;[Printer:GodexRT730]
;; Ganti dengan nama printer kedua yang sebenarnya - lihat --list-printers.
;Name=\\localhost\GodexRT730
;Enabled=1
;Addr=0.0.0.0
;Port=9101

; ===========================================================================
; Kanal kontrol & log - satu untuk semua printer
; ===========================================================================
[Cmd]
; Kanal kontrol line-based, hanya lokal.
; Perintah: QUIT | STOP | STATUS | ENABLE | DISABLE | PRINTER | HELP
; ENABLE/DISABLE tanpa argumen = semua printer, dengan argumen = satu printer.
Addr=127.0.0.1
Port=50000

[Log]
; Streaming log, hanya lokal.
Addr=127.0.0.1
Port=60000
